# CI for ca-nowcaster. Least-privilege; third-party actions pinned to commit SHAs.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-security:
    name: lint-test-security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format (check only)
        run: ruff format --check .

      - name: Pytest (including phase gates)
        run: pytest -q tests/

      - name: pip-audit
        # Skip the local editable install (not on PyPI); audit resolved third-party deps only.
        run: pip-audit --strict --skip-editable

      - name: Bandit
        run: bandit -r src -ll -q

      - name: Secret scan (TruffleHog)
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --only-verified

  holdout-guard:
    name: holdout-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Pushes to main are already reviewed; guard is for PRs.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect holdout path changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            holdout:
              - 'docs/holdout_log.md'
              - 'src/nowcaster/evaluation/holdout/**'
              - 'tests/**/holdout*'
              - '**/holdout_eval*'

      - name: Enforce Evaluation Skeptic branch for holdout edits
        if: steps.filter.outputs.holdout == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: bash scripts/ci/holdout_guard.sh

  # Aggregate job name for branch protection: require "ci"
  ci:
    name: ci
    needs: [lint-test-security, holdout-guard]
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    steps:
      - name: Require green upstream jobs
        run: |
          if [ "${{ needs.lint-test-security.result }}" != "success" ]; then
            echo "lint-test-security failed: ${{ needs.lint-test-security.result }}"
            exit 1
          fi
          # holdout-guard is skipped on push to main
          hg="${{ needs.holdout-guard.result }}"
          if [ "$hg" != "success" ] && [ "$hg" != "skipped" ]; then
            echo "holdout-guard failed: $hg"
            exit 1
          fi
          echo "All required CI jobs passed."
