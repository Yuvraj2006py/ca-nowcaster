# CI for ca-nowcaster. Least-privilege; third-party actions pinned to commit SHAs.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-security:
    name: lint-test-security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade "pip==25.0.1"
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format (check only)
        run: ruff format --check .

      - name: Pytest (including phase gates)
        run: pytest -q tests/

      - name: pip-audit
        # Freeze excludes the local editable install; --no-deps audits the exact resolved set.
        # (pip-audit --strict --skip-editable fails collection on the editable dist itself.)
        run: |
          pip freeze --exclude-editable > "${RUNNER_TEMP}/audit-reqs.txt"
          pip-audit --strict --no-deps -r "${RUNNER_TEMP}/audit-reqs.txt"

      - name: Bandit
        run: bandit -r src -ll -q

      - name: Secret path hygiene (tracked files)
        run: bash scripts/ci/secret_path_hygiene.sh

      - name: Secret scan (TruffleHog)
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --only-verified

  holdout-guard:
    name: holdout-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    # Pushes to main are already reviewed; guard is for PRs.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect holdout path changes
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            holdout:
              - 'docs/holdout_log.md'
              - 'src/nowcaster/evaluation/holdout/**'
              - 'tests/**/holdout*'
              - '**/holdout_eval*'

      - name: Enforce Evaluation Skeptic branch for holdout edits
        if: steps.filter.outputs.holdout == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: bash scripts/ci/holdout_guard.sh

  # Aggregate job name for branch protection: require "ci"
  ci:
    name: ci
    needs: [lint-test-security, holdout-guard]
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    permissions:
      contents: read
    steps:
      - name: Require green upstream jobs
        run: |
          if [ "${{ needs.lint-test-security.result }}" != "success" ]; then
            echo "lint-test-security failed: ${{ needs.lint-test-security.result }}"
            exit 1
          fi
          # holdout-guard is skipped on push to main
          hg="${{ needs.holdout-guard.result }}"
          if [ "$hg" != "success" ] && [ "$hg" != "skipped" ]; then
            echo "holdout-guard failed: $hg"
            exit 1
          fi
          echo "All required CI jobs passed."
