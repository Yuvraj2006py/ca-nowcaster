# Scheduled nowcast: refresh → AR(1) predict → commit prediction log (tamper-evident).
# Production model is AR(1) per docs/evaluation_report.md / docs/live_pipeline.md.
# Does not modify ci.yml. Aligns with docs/failure_modes.md +
# docs/requests/live-idempotent-jobs-and-recovery.md.
name: live-predict

on:
  schedule:
    # Weekdays 14:00 UTC (~ after typical morning StatCan/BoC windows in Toronto).
    - cron: "0 14 * * 1-5"
  workflow_dispatch:

# Least privilege by default; write only on the predict job that commits logs.
permissions:
  contents: read

concurrency:
  group: live-predict
  cancel-in-progress: false

jobs:
  predict:
    name: refresh-and-predict
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade "pip==25.0.1"
          pip install -e .

      - name: Run predict job
        id: predict
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RAW_STORE_PATH: data/raw.duckdb
          PREDICTION_LOG_PATH: logs/predictions.csv
          FAILURE_LOG_PATH: logs/failures.jsonl
          NOWCASTER_HTTP_CACHE: "0"
          LOG_LEVEL: INFO
        run: |
          set +e
          nowcaster-live predict --prediction-log logs/predictions.csv --failure-log logs/failures.jsonl
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "Ingest failure — predict skipped (failure logged / issue attempted)."
            exit 0
          fi
          exit "$code"

      - name: Commit prediction / failure logs (tamper-evident)
        if: always()
        env:
          STAMP: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git config user.name "ca-nowcaster-live[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p logs
          git add logs/predictions.csv logs/failures.jsonl || true
          if git diff --cached --quiet; then
            echo "No log changes to commit."
            exit 0
          fi
          git commit -m "live: predict run ${STAMP} at $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
