# Scheduled scoring: when official GDP MoM appears, append logs/scores.csv.
# Does not modify ci.yml. Aligns with docs/failure_modes.md +
# docs/requests/live-idempotent-jobs-and-recovery.md.
name: live-score

on:
  schedule:
    # Weekdays 16:00 UTC — after predict window; cheap to re-check for new actuals.
    - cron: "0 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-score
  cancel-in-progress: false

jobs:
  score:
    name: score-released-actuals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade "pip==25.0.1"
          pip install -e .

      - name: Refresh store (actuals) then score
        env:
          RAW_STORE_PATH: data/raw.duckdb
          PREDICTION_LOG_PATH: logs/predictions.csv
          SCORE_LOG_PATH: logs/scores.csv
          NOWCASTER_HTTP_CACHE: "0"
          LOG_LEVEL: INFO
        run: |
          nowcaster-ingest-refresh --store data/raw.duckdb || {
            echo "Refresh failed; scoring with existing store only."
          }
          nowcaster-live score --prediction-log logs/predictions.csv --score-log logs/scores.csv

      - name: Commit score log (tamper-evident)
        env:
          STAMP: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git config user.name "ca-nowcaster-live[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p logs
          git add logs/scores.csv || true
          if git diff --cached --quiet; then
            echo "No score changes to commit."
            exit 0
          fi
          git commit -m "live: score run ${STAMP} at $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
