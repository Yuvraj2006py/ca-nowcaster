    verified_at: "2026-10-29T13:50:00+00:00"
    verification_notes: >-
      Candidate table 20-10-0008-01 (productId=20100008) is titled "Retail trade sales by province and
      territory, inactive" in live getCubeMetadata / getAllCubesListLite. Active replacement:
      productId=20100056 title="Monthly retail trade sales by province and territory".
      Coordinate 1.1.1.2.0.0.0.0.0.0 (Canada; Retail trade; Total retail sales; Seasonally adjusted)
      → vectorId=1446859483.
