[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ca-nowcaster"
version = "0.1.0"
description = "Live self-scoring Canadian GDP nowcasting system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ca-nowcaster agents" }]
dependencies = [
  "pandas==2.2.3",
  "numpy==2.2.2",
  "scikit-learn==1.6.1",
  "statsmodels==0.14.4",
  "duckdb==1.1.3",
  "pyyaml==6.0.2",
  # 1.66.1+ allows pillow 13 (needed for pip-audit); older streamlit caps pillow<13.
  "streamlit==1.66.1",
  "requests==2.34.2",
  "python-dotenv==1.2.4",
  "pillow==13.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "ruff==0.17.2",
  "pip-audit==2.8.0",
  "bandit==1.8.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
